services:
  app:
    build: ./app
    container_name: pebble-avatar-app
    restart: unless-stopped
    networks:
      - default
      - traefik-network
    environment:
      - KLING_API_KEY=${KLING_API_KEY:-}
    volumes:
      - ./uploads:/data/uploads
      - ./storage:/data/storage
      - ./build-queue:/data/build-queue
      - ./watchface-template:/watchface-template:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.pebbleavatar.rule=Host(`${SUBDOMAIN:-pebbleface.doronser.com}`)
      - traefik.http.routers.pebbleavatar.tls=true
      - traefik.http.routers.pebbleavatar.entrypoints=web,websecure
      - traefik.http.routers.pebbleavatar.tls.certresolver=mytlschallenge
      - traefik.http.routers.pebbleavatar.middlewares=pebbleavatar@docker
      - traefik.http.middlewares.pebbleavatar.headers.SSLRedirect=true
      - traefik.http.middlewares.pebbleavatar.headers.STSSeconds=315360000
      - traefik.http.middlewares.pebbleavatar.headers.browserXSSFilter=true
      - traefik.http.middlewares.pebbleavatar.headers.contentTypeNosniff=true
      - traefik.http.middlewares.pebbleavatar.headers.forceSTSHeader=true
      - traefik.http.middlewares.pebbleavatar.headers.SSLHost=doronser.com
      - traefik.http.middlewares.pebbleavatar.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.pebbleavatar.headers.STSPreload=true
      - traefik.http.services.pebbleavatar.loadbalancer.server.port=8000
      - traefik.docker.network=traefik-network

  builder:
    build: ./builder
    container_name: pebble-avatar-builder
    restart: unless-stopped
    volumes:
      - ./build-queue:/queue
      - ./storage:/storage

networks:
  traefik-network:
    external: true
