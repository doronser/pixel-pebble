services:
  app:
    build: ./app
    container_name: pebble-avatar-app
    restart: unless-stopped
    networks:
      - default
      - traefik-network
    environment:
      - KLING_API_KEY=${KLING_API_KEY:-}
    volumes:
      - ./uploads:/data/uploads
      - ./storage:/data/storage
      - ./build-queue:/data/build-queue
      - ./watchface-template:/watchface-template:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.pebbleavatar-backend.rule=Host(`${SUBDOMAIN:-pebbleface.doronser.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.pebbleavatar-backend.tls=true
      - traefik.http.routers.pebbleavatar-backend.entrypoints=web,websecure
      - traefik.http.routers.pebbleavatar-backend.tls.certresolver=mytlschallenge
      - traefik.http.services.pebbleavatar-backend.loadbalancer.server.port=8000
      - traefik.docker.network=traefik-network

  frontend:
    build: ./frontend
    container_name: pebble-avatar-frontend
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.pebbleavatar-frontend.rule=Host(`${SUBDOMAIN:-pebbleface.doronser.com}`)
      - traefik.http.routers.pebbleavatar-frontend.tls=true
      - traefik.http.routers.pebbleavatar-frontend.entrypoints=web,websecure
      - traefik.http.routers.pebbleavatar-frontend.tls.certresolver=mytlschallenge
      - traefik.http.routers.pebbleavatar-frontend.middlewares=pebbleavatar-headers@docker
      - traefik.http.middlewares.pebbleavatar-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.pebbleavatar-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.pebbleavatar-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.pebbleavatar-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.pebbleavatar-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.pebbleavatar-headers.headers.SSLHost=doronser.com
      - traefik.http.middlewares.pebbleavatar-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.pebbleavatar-headers.headers.STSPreload=true
      - traefik.http.services.pebbleavatar-frontend.loadbalancer.server.port=3000
      - traefik.docker.network=traefik-network

  builder:
    build: ./builder
    container_name: pebble-avatar-builder
    restart: unless-stopped
    volumes:
      - ./build-queue:/queue
      - ./storage:/storage

networks:
  traefik-network:
    external: true
